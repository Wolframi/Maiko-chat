<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Майко</title>
  <link rel="stylesheet" href="shell.css">
  <script src="shell.js" defer></script>
</head>
<body>
  <div class="desktop-frame">
    <header class="titlebar" id="titlebar">
      <div class="brand"><img src="../assets/icon.png" alt="" width="22" height="22"><span>Майко</span></div>
      <span class="connection" aria-live="polite"><span class="status-dot"></span><span id="status">Запускаем…</span></span>
      <div class="site-update-dock" id="site-update-dock" data-phase="idle" hidden>
        <svg class="site-update-wheel" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg>
        <span id="site-update-label" role="status" aria-live="polite"></span>
        <button id="site-update-retry" data-action="reload" aria-label="Повторить обновление сайта" title="Повторить обновление сайта" hidden>↻</button>
      </div>
      <div class="window-actions">
        <div class="downloads-dock">
          <button id="downloads-action" title="Открыть папку загрузок" aria-label="Открыть папку загрузок" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v11H3ZM3 7V4h7l2 3"/></svg><span id="downloads-count" hidden></span></button>
          <span class="sr-only" id="downloads-status" role="status" aria-live="polite"></span>
        </div>
        <div class="update-dock" id="update-dock" data-phase="idle">
          <span class="app-version" id="app-version" aria-label="Версия приложения"></span>
          <button id="update-action" class="update-button" aria-label="Проверить обновления" title="Проверить обновления">
            <svg class="update-wheel" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg>
            <span id="update-label">Проверить</span>
          </button>
          <progress id="update-progress" max="100" value="0" aria-label="Скачивание обновления" hidden></progress>
          <span class="sr-only" id="update-status" role="status" aria-live="polite"></span>
        </div>
        <button data-action="minimize" title="Свернуть" aria-label="Свернуть"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <button data-action="maximize" id="maximize" title="Развернуть" aria-label="Развернуть"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></svg></button>
        <button data-action="close" class="close-button" title="Закрыть" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
    </header>
    <main class="connection-screen" id="connection-screen">
      <section class="connection-card" aria-live="polite">
        <img class="app-icon" src="../assets/icon.png" width="72" height="72" alt="Майко">
        <p class="eyebrow">ВАШИ ЛЮДИ. ВАШ МАЙКО.</p>
        <h1 id="heading">Почти на месте</h1>
        <p class="description" id="message">Запускаем приложение…</p>
        <div class="loader" id="loader" aria-label="Загрузка"></div>
        <div class="error-actions" id="error-actions" hidden>
          <button class="primary" data-action="reload">Повторить</button>
          <button class="text-button" data-action="logs">Открыть журнал</button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
